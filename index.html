<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa do motorista</title>
<meta name="theme-color" content="#F4C430">
<meta name="description" content="Controle de gastos, ganhos e lucro por litro para motoristas de aplicativo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #EEF0EA;
  --surface: #FFFFFF;
  --ink: #18201C;
  --muted: #5B675F;
  --line: #D3D9CE;
  --gain: #0B7A47;
  --gain-bg: #DCEFE3;
  --loss: #B63A2B;
  --loss-bg: #F6E0DB;
  --sun: #F4C430;
  --sun-ink: #2A2200;
  --sun-bg: #FBEFC0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121715;
    --surface: #1B2420;
    --ink: #EAF0EB;
    --muted: #9AA8A0;
    --line: #2E3A34;
    --gain: #55D38D;
    --gain-bg: #173626;
    --loss: #F28D7D;
    --loss-bg: #3A1E1A;
    --sun-bg: #3A3210;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121715;
  --surface: #1B2420;
  --ink: #EAF0EB;
  --muted: #9AA8A0;
  --line: #2E3A34;
  --gain: #55D38D;
  --gain-bg: #173626;
  --loss: #F28D7D;
  --loss-bg: #3A1E1A;
  --sun-bg: #3A3210;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto;
  max-width: 560px;
  padding: 16px 16px 104px;
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.45 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
h1, h2, h3, .num { font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; }
h1 { margin: 4px 0 12px; font-size: 32px; line-height: 1; font-weight: 700; }
h2 { margin: 0; font-size: 24px; line-height: 1.1; font-weight: 700; }
h3 { margin: 14px 0 0; font-size: 20px; font-weight: 600; }
p { margin: 8px 0; }
.muted { color: var(--muted); font-size: 15px; }

label { display: block; margin: 12px 0 4px; font-size: 15px; font-weight: 500; color: var(--muted); }
input, select, textarea {
  width: 100%;
  padding: 12px;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 6px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 3px solid var(--sun);
  outline-offset: 2px;
}
.money { position: relative; }
.money span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.money input { padding-left: 42px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.group {
  margin: 14px 0;
  padding: 14px 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 6px solid var(--loss);
  border-radius: 10px;
}
.group.gain { border-left-color: var(--gain); }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.group-head .num { font-size: 24px; white-space: nowrap; }
.group .loss-text, .loss-text { color: var(--loss); }
.gain-text { color: var(--gain); }
.card { margin: 14px 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

[hidden] { display: none !important; }
.modes { display: flex; gap: 8px; margin-top: 12px; }
.modes button { flex: 1; }
.modes .ghost[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); font-weight: 600; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 0; }
.chip { padding: 10px 6px; font-size: 15px; font-weight: 500; line-height: 1.2; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-bottom-width: 5px; border-radius: 8px; }
.chip.l { border-bottom-color: var(--loss); }
.chip.g { border-bottom-color: var(--gain); }
.chip[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); font-weight: 600; }
.calc { margin: 10px 0 2px; padding: 10px 12px; background: var(--sun-bg); border-radius: 6px; font-size: 16px; }
.calc .num { font-size: 24px; }

button { font: inherit; cursor: pointer; }
.primary {
  width: 100%;
  margin: 8px 0 4px;
  padding: 14px;
  font-weight: 600;
  font-size: 18px;
  color: var(--sun-ink);
  background: var(--sun);
  border: 0;
  border-radius: 8px;
}
.ghost {
  padding: 8px 12px;
  color: var(--ink);
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 8px;
}
.link { padding: 4px 8px; font-size: 15px; color: var(--loss); background: none; border: 0; text-decoration: underline; }
.msg { min-height: 1.4em; margin: 8px 0; font-size: 16px; font-weight: 500; }
.msg.ok { color: var(--gain); }
.msg.err { color: var(--loss); }

.rows { margin: 8px 0 0; padding: 0; list-style: none; }
.rows li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .sub { display: block; font-size: 14px; color: var(--muted); }
.rows .num { font-size: 20px; white-space: nowrap; }

.hero { margin: 8px 0 14px; padding: 16px; border-radius: 10px; }
.hero.pos { background: var(--gain-bg); }
.hero.neg { background: var(--loss-bg); }
.hero .big { font-size: clamp(40px, 13vw, 58px); line-height: 1; font-weight: 700; white-space: nowrap; }
.hero.pos .big { color: var(--gain); }
.hero.neg .big { color: var(--loss); }
.hero .mid { margin-top: 14px; font-size: 36px; line-height: 1; font-weight: 600; }
.hero p { margin: 4px 0 0; font-size: 15px; color: var(--muted); }

.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 8px; }
.monthnav strong { font-size: 20px; font-weight: 600; text-transform: capitalize; }
.monthnav .ghost { min-width: 48px; font-size: 22px; line-height: 1; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin: 10px 0 0; }
.facts dt { font-size: 14px; color: var(--muted); }
.facts dd { margin: 0; font-size: 26px; line-height: 1.1; font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-weight: 600; }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 16px; }
th, td { padding: 8px 6px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-size: 14px; border-top: 0; }

details { margin: 14px 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
summary { cursor: pointer; font-weight: 600; }
textarea { margin-top: 8px; font-size: 14px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.banner { margin: 8px 0; padding: 10px 12px; background: var(--loss-bg); color: var(--loss); border-radius: 6px; font-weight: 500; }
.empty { padding: 14px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 10px; }

.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center; gap: 8px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.tabs button {
  flex: 1; max-width: 180px;
  padding: 12px 8px;
  font-weight: 600; font-size: 17px;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-radius: 999px;
}
.tabs button[aria-current="page"] { background: var(--sun); color: var(--sun-ink); }
.tabs button { font-size: 16px; padding: 12px 4px; }
input[type="checkbox"], input[type="radio"] { width: auto; }
.dot { display: inline-block; flex: none; width: 11px; height: 11px; margin-right: 8px; border-radius: 50%; vertical-align: 1px; }
.opt { font-weight: 400; }
.sub.warn { color: var(--sun-ink); background: var(--sun-bg); display: inline-block; padding: 0 6px; border-radius: 4px; }
:root[data-theme="dark"] .sub.warn { color: var(--sun); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sub.warn { color: var(--sun); } }
.sub.loss-text { color: var(--loss); font-weight: 500; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.row-btns { display: flex; gap: 2px; align-items: center; }
.link.plain { color: var(--ink); }
.rows li.form-li { display: block; }
.rows li.is-editing { background: var(--sun-bg); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }
.ghost.sm { padding: 6px 10px; font-size: 15px; white-space: nowrap; }
.ghost.add { width: 100%; margin-top: 8px; }
.editing { margin: 12px 0 0; padding: 10px 12px; background: var(--sun-bg); border-radius: 6px; font-weight: 500; }
.alert { margin: 8px 0 14px; padding: 10px 12px; background: var(--sun-bg); border-left: 6px solid var(--sun); border-radius: 6px; font-weight: 500; }
.alert ul { margin: 4px 0 0; padding-left: 18px; font-weight: 400; }
.bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gain); border-radius: 999px; }
.goal { margin-top: 12px; }
.goal p { margin: 6px 0 0; }
details.inner { margin: 12px 0 0; padding: 10px 12px; background: var(--bg); }
.check { display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 12px 0; color: var(--ink); font-size: 17px; border-top: 1px solid var(--line); cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--gain); }
.check .sub { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
.mod-extra { padding: 0 0 12px 34px; }
.mod-extra label:first-child { margin-top: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.sw { position: relative; display: inline-block; margin: 0; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw span { display: block; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); }
.sw input:checked + span { box-shadow: 0 0 0 3px var(--ink); }
.sw input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 3px; }
.help { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.seg { margin: 0 0 10px; }
.chart { display: block; width: 100%; height: auto; margin-top: 8px; }
.chart .b-gain { fill: var(--gain); }
.chart .b-loss { fill: var(--loss); }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 10px; font-family: 'Barlow', system-ui, sans-serif; }
.hbar { margin-top: 10px; }
.hbar-top { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; margin-bottom: 4px; }
.hbar .bar { height: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Caixa do motorista</h1>
<div id="banner" class="banner" hidden>Este navegador não deixou salvar os dados. O que você lançar some quando fechar a página.</div>
<main id="view"></main>
<nav class="tabs" aria-label="Seções">
  <button data-tab="lancar">Lançar</button>
  <button data-tab="km">Km</button>
  <button data-tab="resumo">Resumo</button>
  <button data-tab="ajustes">Ajustes</button>
</nav>
<script>
(function () {
  var KEY = 'caixa-motorista-v1';
  var COLORS = ['#B63A2B', '#D9822B', '#C9A227', '#0B7A47', '#1F8A8A', '#2B7BB9', '#6A4FB3', '#B33A87', '#7A6A55', '#5B675F'];
  var MODULES = [
    ['metas', 'Metas de lucro', 'Meta do dia, da semana e do mês, mostrando quanto falta.'],
    ['horas', 'Horas trabalhadas', 'Anote as horas rodadas no dia e veja o lucro por hora.'],
    ['lembretes', 'Lembretes de manutenção', 'Avisa quando estiver chegando a troca de óleo, pneus etc., pela quilometragem.'],
    ['custokm', 'Custo por km', 'Mostra quanto cada km rodado custa, somando todos os gastos.'],
    ['graficos', 'Gráficos', 'Lucro por dia e gastos por categoria em gráfico, no Resumo.'],
    ['semana', 'Resumo da semana', 'Além do mês, mostra o resumo de segunda a domingo.']
  ];
  function defaultCats() {
    return [
      { id: 'combustivel', kind: 'gasto', name: 'Combustível', color: '#D9822B', fuel: true },
      { id: 'manutencao', kind: 'gasto', name: 'Manutenção', color: '#B63A2B', subs: ['Troca de óleo', 'Pneus', 'Freios', 'Revisão', 'Peças', 'Mecânico'] },
      { id: 'alimentacao', kind: 'gasto', name: 'Alimentação na rua', color: '#C9A227' },
      { id: 'lavagem', kind: 'gasto', name: 'Lavagem', color: '#2B7BB9' },
      { id: 'fixos', kind: 'gasto', name: 'Gastos fixos', color: '#6A4FB3' },
      { id: 'uber', kind: 'ganho', name: 'Uber', color: '#0B7A47' },
      { id: '99', kind: 'ganho', name: '99', color: '#C9A227' },
      { id: 'indrive', kind: 'ganho', name: 'InDrive', color: '#1F8A8A' },
      { id: 'particular', kind: 'ganho', name: 'Particular', color: '#6A4FB3' }
    ];
  }
  function blank() {
    return { entries: [], readings: [], cats: [], fixed: [], hours: {}, reminders: [], cfg: { mods: {}, goals: {}, deprec: 0 } };
  }

  var state = blank();
  var storageOk = true;
  var tab = 'lancar';
  var formDate = todayISO();
  var mode = 'um';
  var oneCat = 'combustivel';
  var editing = null;
  var per = 'mes';
  var month = todayISO().slice(0, 7);
  var weekStart = mondayOf(todayISO());
  var catEdit = null;

  /* ---------- utilidades ---------- */
  function $(s) { return document.querySelector(s); }
  function $$(s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return isoOf(new Date()); }
  function dateOf(s) { return new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
  function addDays(s, n) { var d = dateOf(s); d.setDate(d.getDate() + n); return isoOf(d); }
  function mondayOf(s) { var d = dateOf(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return isoOf(d); }
  function daysIn(m) { return new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(s) {
    if (s == null) return NaN;
    s = String(s).trim().replace(/\s|R\$/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
    var n = parseFloat(s);
    return isFinite(n) ? n : NaN;
  }
  function inNum(n, max) { return n == null ? '' : n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: max || 2, useGrouping: false }); }
  function brl(n) { return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function lit(n) { return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' L'; }
  function kmf(n) { return n.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' km'; }
  function dec1(n) { return n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function hrs(n) { return n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' h'; }
  function dm(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
  function dmy(iso) { return dm(iso) + '/' + iso.slice(0, 4); }
  function say(el, text, err) { if (!el) return; el.textContent = text; el.className = 'msg ' + (err ? 'err' : 'ok'); }
  function sign(n) { return n < 0 ? 'loss-text' : 'gain-text'; }
  function mod(k) { return !!state.cfg.mods[k]; }
  function goal(k) { return +state.cfg.goals[k] || 0; }
  function catById(id) { for (var i = 0; i < state.cats.length; i++) if (state.cats[i].id === id) return state.cats[i]; return null; }
  function catsOf(kind) { return state.cats.filter(function (c) { return c.kind === kind; }); }
  function catName(id) { var c = catById(id); return c ? c.name : String(id); }
  function dot(id) { var c = catById(id); return '<span class="dot" style="background:' + esc(c ? c.color : '#5B675F') + '"></span>'; }

  /* ---------- armazenamento ---------- */
  function normalize(d) {
    var s = blank();
    if (d && typeof d === 'object') {
      if (Array.isArray(d.entries)) s.entries = d.entries;
      if (Array.isArray(d.readings)) s.readings = d.readings;
      if (Array.isArray(d.cats)) s.cats = d.cats;
      if (Array.isArray(d.fixed)) s.fixed = d.fixed;
      if (d.hours && typeof d.hours === 'object' && !Array.isArray(d.hours)) s.hours = d.hours;
      if (Array.isArray(d.reminders)) s.reminders = d.reminders;
      if (d.cfg && typeof d.cfg === 'object') {
        s.cfg.mods = d.cfg.mods || {};
        s.cfg.goals = d.cfg.goals || {};
        s.cfg.deprec = +d.cfg.deprec || 0;
      }
    }
    if (!s.cats.length) s.cats = defaultCats();
    // lançamentos de uma categoria que não existe mais ganham uma categoria de volta
    s.entries.forEach(function (e) {
      if (!s.cats.some(function (c) { return c.id === e.cat; })) {
        s.cats.push({ id: e.cat, kind: e.kind === 'ganho' ? 'ganho' : 'gasto', name: String(e.cat), color: '#5B675F' });
      }
    });
    return s;
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      state = normalize(raw ? JSON.parse(raw) : null);
    } catch (e) { storageOk = false; state = normalize(null); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { storageOk = false; $('#banner').hidden = false; }
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  /* ---------- gastos fixos: lança sozinho todo mês ---------- */
  function runFixed() {
    var today = todayISO(), cur = today.slice(0, 7), changed = false;
    state.fixed.forEach(function (f) {
      var m = f.next || f.start;
      while (m <= cur) {
        var date = m + '-' + pad(Math.min(f.day, daysIn(m)));
        if (date > today) break;
        state.entries.push({ id: uid(), date: date, kind: 'gasto', cat: f.cat, amount: f.amount, note: f.name, fixed: f.id });
        m = shiftMonth(m, 1);
        changed = true;
      }
      f.next = m;
    });
    if (changed) save();
  }

  /* ---------- cálculos ---------- */
  function totals(list) {
    var g = 0, s = 0, l = 0, by = {};
    list.forEach(function (e) {
      by[e.cat] = (by[e.cat] || 0) + e.amount;
      if (e.kind === 'ganho') g += e.amount;
      else { s += e.amount; l += (e.liters || 0); }
    });
    return { g: g, s: s, lit: l, lucro: g - s, by: by };
  }
  function sortedReadings() {
    return state.readings.slice().sort(function (a, b) {
      if (a.date === b.date) return a.km - b.km;
      return a.date < b.date ? -1 : 1;
    });
  }
  function currentKm() { var r = sortedReadings(); return r.length ? r[r.length - 1].km : null; }
  function intervals() {
    var r = sortedReadings(), out = [];
    for (var i = 1; i < r.length; i++) {
      var p = r[i - 1], c = r[i];
      var list = state.entries.filter(function (e) { return e.date > p.date && e.date <= c.date; });
      var t = totals(list), km = c.km - p.km;
      out.push({
        id: c.id, from: p.date, to: c.date, km: km,
        lit: t.lit, ganhos: t.g, gastos: t.s, lucro: t.lucro,
        perL: t.lit > 0 ? t.lucro / t.lit : null,
        kmL: (t.lit > 0 && km > 0) ? km / t.lit : null,
        perKm: km > 0 ? t.lucro / km : null,
        costKm: km > 0 ? t.s / km : null
      });
    }
    return out;
  }
  function goalHtml(lucro, g, label) {

    var txt = lucro >= g
      ? 'Meta ' + label + ' batida! Meta de ' + brl(g) + '.'
      : 'Faltam ' + brl(g - lucro) + ' para a meta ' + label + ' de ' + brl(g) + '.';
    return '<div class="goal"><div class="bar" role="progressbar" aria-valuenow="' + Math.round(pct) + '" aria-valuemin="0" aria-valuemax="100" aria-label="Meta ' + label + '"><i style="width:' + pct.toFixed(1) + '%"></i></div><p class="muted">' + txt + '</p></div>';
  }

  /* ---------- confirmação em dois toques ---------- */
  function arm(btn, confirmText, fn) {
    if (btn.dataset.armed) { fn(); return; }
    btn.dataset.armed = '1';
    btn.dataset.orig = btn.textContent;
    btn.textContent = confirmText;
    setTimeout(function () {
      if (btn.isConnected && btn.dataset.armed) {
        delete btn.dataset.armed;
        btn.textContent = btn.dataset.orig;
      }
    }, 3500);
  }

  /* ---------- lembretes de manutenção ---------- */

    var left = r.last + r.every - cur;
    if (left < 0) return { txt: 'Passou ' + kmf(-left) + ' do prazo', cls: 'loss-text', left: left };
    if (left <= 500) return { txt: 'Faltam ' + kmf(left) + ', está chegando', cls: 'warn', left: left };
    return { txt: 'Faltam ' + kmf(left), cls: '', left: left };
  }
  function maintAlert() {
    if (!mod('lembretes')) return '';

    if (cur == null) return '';

    if (!due.length) return '';
    return '<div class="alert" role="status">Manutenção chegando<ul>' + due.map(function (r) {
      return '<li>' + esc(r.name) + ': ' + remStatus(r, cur).txt.toLowerCase() + '</li>';

  }

  /* ---------- aba Lançar ---------- */
  function money(id, label, ph, cls) {

  function block(c, i) {

    if (c.fuel) {

        '<label for="' + p + '-t">Combustível</label><select id="' + p + '-t" class="in-type"><option value="etanol">Etanol</option><option value="gasolina">Gasolina</option></select>' +
        '<p class="calc in-liters"></p>';

          c.subs.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') + '</select>';
      }
    }
    h += '<div class="note-wrap"><label for="' + p + '-n">Observação <span class="opt">(opcional)</span></label><input id="' + p + '-n" class="in-note" maxlength="140" autocomplete="off" placeholder="' +
      (c.kind === 'ganho' ? 'ex.: corrida para o aeroporto' : 'ex.: troquei a pastilha dianteira') + '"></div>';

  }
  function blockFor(id) { return $$('.cat').filter(function (b) { return b.dataset.cat === id; })[0]; }
  function viewLancar() {
    if (!catById(oneCat)) oneCat = state.cats[0].id;
    var i = 0;
    var h = maintAlert() +
      '<div class="card"><label for="f-date" style="margin-top:0">Dia do lançamento</label><input type="date" id="f-date" value="' + formDate + '">' +
      (mod('horas') ? '<label for="f-hours">Horas rodadas neste dia <span class="opt">(opcional)</span></label><input id="f-hours" inputmode="decimal" autocomplete="off" placeholder="ex.: 8,5">' : '') +
      (editing
        ? '<p class="editing">Editando um lançamento. <button class="link" id="cancel-edit">Cancelar edição</button></p>'
        : '<div class="modes" role="group" aria-label="Modo de lançamento"><button class="ghost" data-mode="um">Um por vez</button><button class="ghost" data-mode="tudo">Vários de uma vez</button></div>') +
      '</div>' +
      '<div class="card" id="pick"><label for="f-cat" style="margin-top:0">O que você quer lançar?</label><select id="f-cat">' + catOptions(oneCat, ['gasto', 'ganho']) + '</select></div>' +
      '<section class="group grp"><h2 class="grp-title">Gastos</h2>' + catsOf('gasto').map(function (c) { return block(c, i++); }).join('') + '</section>' +
      '<section class="group gain grp"><h2 class="grp-title">Ganhos</h2>' + catsOf('ganho').map(function (c) { return block(c, i++); }).join('') + '</section>' +

    $('#view').innerHTML = h;
    fillHours();
    $$('.cat').forEach(function (b) {
      if (!b.querySelector('.in-price')) return;
      $$('.in-amount, .in-price', b).forEach(function (x) { x.addEventListener('input', function () { updLiters(b); }); });
      b.querySelector('.in-type').addEventListener('change', function () { updLiters(b); });
      updLiters(b);
    });
    $('#f-date').addEventListener('change', function () { formDate = $('#f-date').value || todayISO(); fillHours(); renderDayList(); });

  function fillHours() {

  function applyMode() {
    var um = mode === 'um' || !!editing;
    $$('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
    $('#pick').hidden = !um;
    $$('.cat').forEach(function (c) { c.hidden = um && c.dataset.cat !== oneCat; });
    $$('.grp').forEach(function (g) {
      g.hidden = um && !g.querySelector('.cat:not([hidden])');
      g.querySelector('.grp-title').hidden = um;
    });
    $$('.cat-title').forEach(function (t) { t.hidden = um; });
    $$('.note-wrap').forEach(function (n) { n.hidden = !um; });
    $('#save-day').textContent = editing ? 'Salvar alteração' : um ? 'Salvar lançamento' : 'Salvar tudo';
  }
  function updLiters(b) {
    var a = num(b.querySelector('.in-amount').value), p = num(b.querySelector('.in-price').value);
    b.querySelector('.in-liters').innerHTML = (a > 0 && p > 0)
      ? 'Entraram <span class="num">' + lit(a / p) + '</span> de ' + b.querySelector('.in-type').value
      : 'Preencha o valor pago e o preço do litro para ver quantos litros entraram.';
  }
  function saveDay() {
    var msg = $('#msg'), date = $('#f-date').value;
    if (!date) { say(msg, 'Escolha o dia do lançamento.', true); return; }
    var add = [];
    var blocks = $$('.cat').filter(function (b) { return !b.hidden; });
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i], c = catById(b.dataset.cat), e;
      var aTxt = b.querySelector('.in-amount').value.trim();
      if (c.fuel) {
        var pTxt = b.querySelector('.in-price').value.trim();
        if (!aTxt && !pTxt) continue;
        var fa = num(aTxt), fp = num(pTxt);
        if (!(fa > 0 && fp > 0)) { say(msg, 'Em ' + c.name + ', informe o valor pago e o preço do litro.', true); return; }
        e = { kind: 'gasto', cat: c.id, amount: fa, price: fp, liters: fa / fp, fuel: b.querySelector('.in-type').value };
      } else {
        if (!aTxt) continue;
        var n = num(aTxt);
        if (!(n > 0)) { say(msg, 'Valor inválido em ' + c.name + '.', true); return; }
        e = { kind: c.kind, cat: c.id, amount: n };
        var sub = b.querySelector('.in-sub');
        if (sub && sub.value) e.sub = sub.value;
      }
      var note = b.querySelector('.in-note');
      if (note && !note.closest('[hidden]') && note.value.trim()) e.note = note.value.trim();
      add.push(e);
    }
    var hoursChanged = false, newHours = null;
    var hf = $('#f-hours');
    if (hf) {
      var hTxt = hf.value.trim(), prev = state.hours[date];
      if (hTxt) {
        newHours = num(hTxt);
        if (!(newHours > 0 && newHours <= 24)) { say(msg, 'Horas rodadas: use um número de 0 a 24, por exemplo 8,5.', true); return; }
        hoursChanged = newHours !== prev;
      } else if (prev != null) hoursChanged = true;
    }
    if (editing) {
      if (add.length !== 1) { say(msg, 'Preencha o valor do lançamento.', true); return; }
      var idx = -1;
      state.entries.forEach(function (x, k) { if (x.id === editing) idx = k; });
      if (idx > -1) {
        var old = state.entries[idx];
        add[0].id = old.id; add[0].date = date;
        if (old.fixed) add[0].fixed = old.fixed;
        state.entries[idx] = add[0];
      }
    } else {
      if (!add.length && !hoursChanged) { say(msg, 'Preencha pelo menos um campo.', true); return; }
      add.forEach(function (x) { x.id = uid(); x.date = date; state.entries.push(x); });
    }
    if (hoursChanged) { if (newHours == null) delete state.hours[date]; else state.hours[date] = newHours; }
    save();
    var wasEditing = !!editing;
    editing = null;
    formDate = date;
    viewLancar();
    var t = totals(state.entries.filter(function (x) { return x.date === date; }));
    say($('#msg'), (wasEditing ? 'Alteração salva.' : 'Salvo.') + ' Lucro de ' + dm(date) + ': ' + brl(t.lucro), false);
  }
  function startEdit(id) {
    var e = state.entries.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    editing = id; formDate = e.date; oneCat = e.cat; tab = 'lancar';
    render();
    var b = blockFor(e.cat);
    if (!b) return;
    b.querySelector('.in-amount').value = inNum(e.amount);
    if (b.querySelector('.in-price')) {
      b.querySelector('.in-price').value = inNum(e.price, 3);
      if (e.fuel) b.querySelector('.in-type').value = e.fuel;
      updLiters(b);
    }
    var sub = b.querySelector('.in-sub');
    if (sub && e.sub) {
      if (!$$('option', sub).some(function (o) { return o.value === e.sub; })) {
        var o = document.createElement('option'); o.textContent = e.sub; sub.appendChild(o);
      }
      sub.value = e.sub;
    }
    b.querySelector('.in-note').value = e.note || '';
  }
  function entryLabel(e) {
    var main = esc(catName(e.cat)) + (e.sub ? ' · ' + esc(e.sub) : '');
    var subs = [];
    if (e.liters) subs.push((e.fuel ? esc(e.fuel) + ', ' : '') + lit(e.liters) + ' a ' + brl(e.price || 0) + ' o litro');
    if (e.fixed) subs.push('gasto fixo');
    if (e.note) subs.push(esc(e.note));
    return main + (subs.length ? '<span class="sub">' + subs.join(' · ') + '</span>' : '');
  }
  function renderDayList() {
    var box = $('#day-list');
    if (!box) return;
    var list = state.entries.filter(function (e) { return e.date === formDate; });
    var h = mod('horas') ? state.hours[formDate] : null;
    if (!list.length && !h) {
      box.innerHTML = '<p class="empty">Nada lançado em ' + dmy(formDate) + ' ainda.</p>';
      return;
    }
    var t = totals(list);
    box.innerHTML =
      '<div class="card"><div class="group-head"><h2>Lançado em ' + dmy(formDate) + '</h2><span class="num ' + sign(t.lucro) + '">' + brl(t.lucro) + '</span></div>' +
      '<p class="muted">Ganhos ' + brl(t.g) + ' e gastos ' + brl(t.s) +
        (h ? '. ' + hrs(h) + ' rodadas, ' + brl(t.lucro / h) + ' de lucro por hora' : '') + '</p>' +
      goalHtml(t.lucro, goal('dia'), 'do dia') +
      (list.length ? '<ul class="rows">' + list.map(function (e) {
        return '<li' + (e.id === editing ? ' class="is-editing"' : '') + '><span>' + dot(e.cat) + '</span><span style="flex:1">' + entryLabel(e) + '</span><span class="row-end"><span class="num ' + (e.kind === 'ganho' ? 'gain-text' : 'loss-text') + '">' +
          (e.kind === 'ganho' ? '+' : '−') + brl(e.amount) + '</span><span class="row-btns"><button class="link plain" data-edit-entry="' + e.id + '">Editar</button><button class="link" data-del-entry="' + e.id + '">Apagar</button></span></span></li>';
      }).join('') + '</ul>' : '') + '</div>';
  }

  /* ---------- aba Km ---------- */
  function viewKm() {
    $('#view').innerHTML =
      '<div class="card">' +
        '<h2>Quilometragem do carro</h2>' +
        '<p class="muted">Atualize uma vez por semana, não precisa ser todo dia.</p>' +
        '<label for="k-km">Quilometragem atual</label>' +
        '<input id="k-km" inputmode="numeric" autocomplete="off" placeholder="ex.: 84520">' +
        '<label for="k-date">Data da leitura</label>' +
        '<input type="date" id="k-date" value="' + todayISO() + '">' +
        '<button class="primary" id="save-km">Salvar quilometragem</button>' +
        '<p class="msg" id="kmsg" role="status"></p>' +
      '</div>' +
      '<section id="km-result"></section>' +
      (mod('lembretes') ? '<section id="km-rem"></section>' : '') +
      '<section id="km-hist"></section>';
    $('#save-km').addEventListener('click', saveKm);
    renderKm();
    renderRem();
  }
  function saveKm() {
    var msg = $('#kmsg'), n = num($('#k-km').value), date = $('#k-date').value;
    if (!(n > 0) || !date) { say(msg, 'Informe a quilometragem e a data.', true); return; }
    n = Math.round(n);
    var test = state.readings.concat([{ id: 'x', date: date, km: n }]).sort(function (a, b) {
      if (a.date === b.date) return a.km - b.km;
      return a.date < b.date ? -1 : 1;
    });
    for (var i = 1; i < test.length; i++) {
      if (test[i].km < test[i - 1].km) {
        say(msg, 'Essa quilometragem não combina com as outras leituras. Ela só pode crescer com o tempo.', true);
        return;
      }
    }
    state.readings.push({ id: uid(), date: date, km: n });
    save();
    $('#k-km').value = '';
    say(msg, 'Quilometragem salva.', false);
    renderKm();
    renderRem();
  }
  function renderKm() {
    var iv = intervals(), last = iv[iv.length - 1], res = $('#km-result');
    if (!state.readings.length) {
      res.innerHTML = '<p class="empty">Salve a primeira leitura agora. A partir da segunda, eu mostro o lucro por litro.</p>';
    } else if (!last) {
      res.innerHTML = '<p class="empty">Primeira leitura salva. Na próxima atualização, eu calculo os litros gastos e o lucro por litro.</p>';
    } else {
      res.innerHTML =
        '<div class="hero ' + (last.lucro < 0 ? 'neg' : 'pos') + '">' +
          '<div class="num big">' + (last.perL == null ? '–' : brl(last.perL)) + '</div>' +
          '<p>Lucro por litro, de ' + dm(last.from) + ' a ' + dm(last.to) + '</p>' +

        '</div>' +
        '<div class="card"><dl class="facts">' +

          '<div><dt>Litros abastecidos</dt><dd>' + (last.lit > 0 ? lit(last.lit) : '–') + '</dd></div>' +
          '<div><dt>Consumo</dt><dd>' + (last.kmL == null ? '–' : dec1(last.kmL) + ' km/L') + '</dd></div>' +
          '<div><dt>Lucro por km</dt><dd>' + (last.perKm == null ? '–' : brl(last.perKm)) + '</dd></div>' +
          (mod('custokm') ? '<div><dt>Custo por km</dt><dd class="loss-text">' + (last.costKm == null ? '–' : brl(last.costKm)) + '</dd></div>' : '') +
          '<div><dt>Ganhos</dt><dd class="gain-text">' + brl(last.ganhos) + '</dd></div>' +
          '<div><dt>Gastos</dt><dd class="loss-text">' + brl(last.gastos) + '</dd></div>' +

        '</dl>' +

      var i = byId[x.id];

      return '<li><span>' + dmy(x.date) + '<span class="sub">' + sub + '</span></span><span><span class="num">' + kmf(x.km) +
        '</span> <button class="link" data-del-reading="' + x.id + '">Apagar</button></span></li>';

  function renderRem() {

  /* ---------- aba Resumo ---------- */
  function monthLabel(m) {
    var y = +m.slice(0, 4), mo = +m.slice(5, 7);
    return new Date(y, mo - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  }
  function shiftMonth(m, d) {
    var y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + d;
    var dt = new Date(y, mo, 1);
    return dt.getFullYear() + '-' + pad(dt.getMonth() + 1);
  }
  function rangeNow() {
    if (per === 'semana') {
      var end = addDays(weekStart, 6);
      return { start: weekStart, end: end, label: dm(weekStart) + ' a ' + dm(end), goal: goal('semana'), goalLbl: 'da semana', name: 'da semana', dep: 7 / 30 };
    }
    return { start: month + '-01', end: month + '-' + pad(daysIn(month)), label: monthLabel(month), goal: goal('mes'), goalLbl: 'do mês', name: 'do mês', dep: 1 };
  }
  function chartDays(R, days) {
    var keys = [];
    for (var d = R.start; d <= R.end; d = addDays(d, 1)) keys.push(d);
    var vals = keys.map(function (k) { return days[k] ? days[k].g - days[k].s : 0; });
    if (!vals.some(function (v) { return v; })) return '<p class="muted">Nenhum lançamento no período.</p>';
    var max = Math.max.apply(null, vals.map(Math.abs).concat([1]));
    var hasNeg = vals.some(function (v) { return v < 0; });
    var W = 320, H = 150, top = 6, ch = H - top - 18;
    var scale = (hasNeg ? ch / 2 : ch) / max, zero = hasNeg ? top + ch / 2 : top + ch;
    var bw = W / keys.length, gap = Math.max(1, bw * 0.15);
    var wk = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];

      var v = vals[i], h = Math.max(v ? 1 : 0, Math.abs(v) * scale);
      out += '<rect class="' + (v < 0 ? 'b-loss' : 'b-gain') + '" x="' + (i * bw + gap / 2).toFixed(1) + '" y="' + (v < 0 ? zero : zero - h).toFixed(1) +
        '" width="' + (bw - gap).toFixed(1) + '" height="' + h.toFixed(1) + '"><title>' + dm(k) + ': ' + brl(v) + '</title></rect>';

      }

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Lucro por dia">' +
      '<line class="axis" x1="0" x2="' + W + '" y1="' + zero.toFixed(1) + '" y2="' + zero.toFixed(1) + '"></line>' + out + '</svg>';
  }

  function copyBackup() {

      try { if (document.execCommand('copy')) { done(); return; } } catch (e) {}
      say(msg, 'Selecionei o texto. Segure sobre ele e escolha Copiar.', false);
    };
    try {

    try {
      var d = JSON.parse(ta.value);
      if (!d || !Array.isArray(d.entries) || !Array.isArray(d.readings)) throw new Error('formato');
      state = normalize(d);
      runFixed();
      save();
      viewAjustes();
      $('#sec-backup').open = true;
      say($('#b-msg'), 'Dados restaurados.', false);
    } catch (e) {
      say(msg, 'Não consegui ler esse texto. Cole o backup completo na caixa.', true);
      var b = $('#b-restore');
      delete b.dataset.armed;
      b.textContent = 'Restaurar';
    }
  }

  /* ---------- navegação e eventos globais ---------- */
  function render() {
    $$('.tabs button').forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (tab !== 'ajustes') catEdit = null;
    if (tab === 'lancar') viewLancar();
    else if (tab === 'km') viewKm();
    else if (tab === 'resumo') viewResumo();
    else viewAjustes();
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { if (t.dataset.tab !== 'lancar') editing = null; tab = t.dataset.tab; render(); return; }
    if (t.dataset.editEntry) { startEdit(t.dataset.editEntry); return; }
    if (t.dataset.delEntry) {
      var id = t.dataset.delEntry;
      arm(t, 'Confirmar', function () {
        state.entries = state.entries.filter(function (e) { return e.id !== id; });
        save();
        if (editing === id) { editing = null; viewLancar(); } else renderDayList();
      });
      return;
    }
    if (t.dataset.delReading) {
      var rid = t.dataset.delReading;
      arm(t, 'Confirmar', function () {
        state.readings = state.readings.filter(function (e) { return e.id !== rid; });
        save(); renderKm(); renderRem();
      });
      return;
    }
    if (t.dataset.remDone) {
      var cur = currentKm();
      state.reminders.forEach(function (r) { if (r.id === t.dataset.remDone && cur != null) r.last = cur; });
      save(); renderRem();
      return;
    }
    if (t.dataset.remDel) {
      var mid = t.dataset.remDel;
      arm(t, 'Confirmar', function () {
        state.reminders = state.reminders.filter(function (r) { return r.id !== mid; });
        save(); renderRem();
      });
      return;
    }
    if (t.dataset.catEdit || t.dataset.catNew) {
      catEdit = t.dataset.catEdit || 'new:' + t.dataset.catNew;
      viewAjustes();
      ($('#cf-name').closest('li') || $('#cf-name').closest('details')).scrollIntoView({ block: 'center' });
      return;
    }
    if (t.dataset.fixedDel) {
      var fid = t.dataset.fixedDel;
      arm(t, 'Parar de lançar?', function () {
        state.fixed = state.fixed.filter(function (f) { return f.id !== fid; });
        save(); viewAjustes();
      });
    }
  });
  load();
  runFixed();
  if (!storageOk) $('#banner').hidden = false;
  render();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
