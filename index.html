<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa do motorista</title>
<meta name="theme-color" content="#F4C430">
<meta name="description" content="Controle de gastos, ganhos e lucro por litro para motoristas de aplicativo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #EEF0EA;
  --surface: #FFFFFF;
  --ink: #18201C;
  --muted: #5B675F;
  --line: #D3D9CE;
  --gain: #0B7A47;
  --gain-bg: #DCEFE3;
  --loss: #B63A2B;
  --loss-bg: #F6E0DB;
  --sun: #F4C430;
  --sun-ink: #2A2200;
  --sun-bg: #FBEFC0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121715;
    --surface: #1B2420;
    --ink: #EAF0EB;
    --muted: #9AA8A0;
    --line: #2E3A34;
    --gain: #55D38D;
    --gain-bg: #173626;
    --loss: #F28D7D;
    --loss-bg: #3A1E1A;
    --sun-bg: #3A3210;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121715;
  --surface: #1B2420;
  --ink: #EAF0EB;
  --muted: #9AA8A0;
  --line: #2E3A34;
  --gain: #55D38D;
  --gain-bg: #173626;
  --loss: #F28D7D;
  --loss-bg: #3A1E1A;
  --sun-bg: #3A3210;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto;
  max-width: 560px;
  padding: 16px 16px 104px;
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.45 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
h1, h2, h3, .num { font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; }
h1 { margin: 4px 0 12px; font-size: 32px; line-height: 1; font-weight: 700; }
h2 { margin: 0; font-size: 24px; line-height: 1.1; font-weight: 700; }
h3 { margin: 14px 0 0; font-size: 20px; font-weight: 600; }
p { margin: 8px 0; }
.muted { color: var(--muted); font-size: 15px; }

label { display: block; margin: 12px 0 4px; font-size: 15px; font-weight: 500; color: var(--muted); }
input, select, textarea {
  width: 100%;
  padding: 12px;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 6px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 3px solid var(--sun);
  outline-offset: 2px;
}
.money { position: relative; }
.money span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.money input { padding-left: 42px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.group {
  margin: 14px 0;
  padding: 14px 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 6px solid var(--loss);
  border-radius: 10px;
}
.group.gain { border-left-color: var(--gain); }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.group-head .num { font-size: 24px; }
.group .loss-text, .loss-text { color: var(--loss); }
.gain-text { color: var(--gain); }
.card { margin: 14px 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

[hidden] { display: none !important; }
.modes { display: flex; gap: 8px; margin-top: 12px; }
.modes button { flex: 1; }
.modes .ghost[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); font-weight: 600; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 0; }
.chip { padding: 10px 6px; font-size: 15px; font-weight: 500; line-height: 1.2; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-bottom-width: 5px; border-radius: 8px; }
.chip.l { border-bottom-color: var(--loss); }
.chip.g { border-bottom-color: var(--gain); }
.chip[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); font-weight: 600; }
.calc { margin: 10px 0 2px; padding: 10px 12px; background: var(--sun-bg); border-radius: 6px; font-size: 16px; }
.calc .num { font-size: 24px; }

button { font: inherit; cursor: pointer; }
.primary {
  width: 100%;
  margin: 8px 0 4px;
  padding: 14px;
  font-weight: 600;
  font-size: 18px;
  color: var(--sun-ink);
  background: var(--sun);
  border: 0;
  border-radius: 8px;
}
.ghost {
  padding: 8px 12px;
  color: var(--ink);
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 8px;
}
.link { padding: 4px 8px; font-size: 15px; color: var(--loss); background: none; border: 0; text-decoration: underline; }
.msg { min-height: 1.4em; margin: 8px 0; font-size: 16px; font-weight: 500; }
.msg.ok { color: var(--gain); }
.msg.err { color: var(--loss); }

.rows { margin: 8px 0 0; padding: 0; list-style: none; }
.rows li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .sub { display: block; font-size: 14px; color: var(--muted); }
.rows .num { font-size: 20px; white-space: nowrap; }

.hero { margin: 8px 0 14px; padding: 16px; border-radius: 10px; }
.hero.pos { background: var(--gain-bg); }
.hero.neg { background: var(--loss-bg); }
.hero .big { font-size: 58px; line-height: 1; font-weight: 700; }
.hero.pos .big { color: var(--gain); }
.hero.neg .big { color: var(--loss); }
.hero .mid { margin-top: 14px; font-size: 36px; line-height: 1; font-weight: 600; }
.hero p { margin: 4px 0 0; font-size: 15px; color: var(--muted); }

.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 8px; }
.monthnav strong { font-size: 20px; font-weight: 600; text-transform: capitalize; }
.monthnav .ghost { min-width: 48px; font-size: 22px; line-height: 1; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin: 10px 0 0; }
.facts dt { font-size: 14px; color: var(--muted); }
.facts dd { margin: 0; font-size: 26px; line-height: 1.1; font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-weight: 600; }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 16px; }
th, td { padding: 8px 6px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-size: 14px; border-top: 0; }

details { margin: 14px 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
summary { cursor: pointer; font-weight: 600; }
textarea { margin-top: 8px; font-size: 14px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.banner { margin: 8px 0; padding: 10px 12px; background: var(--loss-bg); color: var(--loss); border-radius: 6px; font-weight: 500; }
.empty { padding: 14px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 10px; }

.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center; gap: 8px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.tabs button {
  flex: 1; max-width: 180px;
  padding: 12px 8px;
  font-weight: 600; font-size: 17px;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-radius: 999px;
}
.tabs button[aria-current="page"] { background: var(--sun); color: var(--sun-ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Caixa do motorista</h1>
<div id="banner" class="banner" hidden>Este navegador não deixou salvar os dados. O que você lançar some quando fechar a página.</div>
<main id="view"></main>
<nav class="tabs" aria-label="Seções">
  <button data-tab="lancar">Lançar</button>
  <button data-tab="km">Km</button>
  <button data-tab="mes">Mês</button>
</nav>

<script>
(function () {
  var KEY = 'caixa-motorista-v1';
  var state = { entries: [], readings: [] };
  var storageOk = true;
  var tab = 'lancar';
  var formDate = todayISO();
  var mode = 'um';
  var oneCat = 'combustivel';
  var month = todayISO().slice(0, 7);

  var CAT_NAME = { combustivel: 'Combustível', alimentacao: 'Alimentação na rua', lavagem: 'Lavagem', uber: 'Uber', '99': '99', particular: 'Particular' };
  var GASTOS = ['combustivel', 'alimentacao', 'lavagem'];
  var GANHOS = ['uber', '99', 'particular'];
  var SIMPLE = [
    ['f-alim', 'gasto', 'alimentacao'],
    ['f-lav', 'gasto', 'lavagem'],
    ['f-uber', 'ganho', 'uber'],
    ['f-99', 'ganho', '99'],
    ['f-part', 'ganho', 'particular']
  ];

  /* ---------- utilidades ---------- */
  function $(s) { return document.querySelector(s); }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function num(s) {
    if (s == null) return NaN;
    s = String(s).trim().replace(/\s|R\$/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
    var n = parseFloat(s);
    return isFinite(n) ? n : NaN;
  }
  function brl(n) { return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function lit(n) { return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' L'; }
  function kmf(n) { return n.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' km'; }
  function dec1(n) { return n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function dm(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
  function dmy(iso) { return dm(iso) + '/' + iso.slice(0, 4); }
  function say(el, text, err) { el.textContent = text; el.className = 'msg ' + (err ? 'err' : 'ok'); }
  function sign(n) { return n < 0 ? 'loss-text' : 'gain-text'; }

  /* ---------- armazenamento ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        state.entries = Array.isArray(d.entries) ? d.entries : [];
        state.readings = Array.isArray(d.readings) ? d.readings : [];
      }
    } catch (e) { storageOk = false; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { storageOk = false; $('#banner').hidden = false; }
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  /* ---------- cálculos ---------- */
  function totals(list) {
    var g = 0, s = 0, l = 0, by = {};
    list.forEach(function (e) {
      by[e.cat] = (by[e.cat] || 0) + e.amount;
      if (e.kind === 'ganho') g += e.amount;
      else { s += e.amount; if (e.cat === 'combustivel') l += (e.liters || 0); }
    });
    return { g: g, s: s, lit: l, lucro: g - s, by: by };
  }
  function sortedReadings() {
    return state.readings.slice().sort(function (a, b) {
      if (a.date === b.date) return a.km - b.km;
      return a.date < b.date ? -1 : 1;
    });
  }
  function intervals() {
    var r = sortedReadings(), out = [];
    for (var i = 1; i < r.length; i++) {
      var p = r[i - 1], c = r[i];
      var list = state.entries.filter(function (e) { return e.date > p.date && e.date <= c.date; });
      var t = totals(list), km = c.km - p.km;
      out.push({
        id: c.id, from: p.date, to: c.date, km: km,
        lit: t.lit, ganhos: t.g, gastos: t.s, lucro: t.lucro,
        perL: t.lit > 0 ? t.lucro / t.lit : null,
        kmL: (t.lit > 0 && km > 0) ? km / t.lit : null,
        perKm: km > 0 ? t.lucro / km : null
      });
    }
    return out;
  }

  /* ---------- confirmação em dois toques ---------- */
  function arm(btn, confirmText, fn) {
    if (btn.dataset.armed) { fn(); return; }
    btn.dataset.armed = '1';
    btn.dataset.orig = btn.textContent;
    btn.textContent = confirmText;
    setTimeout(function () {
      if (btn.isConnected && btn.dataset.armed) {
        delete btn.dataset.armed;
        btn.textContent = btn.dataset.orig;
      }
    }, 3500);
  }

  /* ---------- aba Lançar ---------- */
  function money(id, label, ph) {
    return '<label for="' + id + '">' + label + '</label><div class="money"><span>R$</span><input id="' + id + '" inputmode="decimal" autocomplete="off" placeholder="' + ph + '"></div>';
  }

  function viewLancar() {
    $('#view').innerHTML =
      '<div class="card"><label for="f-date" style="margin-top:0">Dia do lançamento</label><input type="date" id="f-date" value="' + formDate + '">' +
        '<div class="modes" role="group" aria-label="Modo de lançamento"><button class="ghost" data-mode="um">Um por vez</button><button class="ghost" data-mode="tudo">Vários de uma vez</button></div></div>' +
      '<div class="chips" id="chips" role="group" aria-label="O que você quer lançar?">' +
        GASTOS.concat(GANHOS).map(function (c) {
          return '<button class="chip ' + (GANHOS.indexOf(c) > -1 ? 'g' : 'l') + '" data-cat-pick="' + c + '">' + CAT_NAME[c] + '</button>';
        }).join('') +
      '</div>' +
      '<section class="group grp">' +
        '<h2 class="grp-title">Gastos</h2>' +
        '<div class="cat" data-cat="combustivel">' +
          '<h3>Combustível</h3>' +
          '<div class="row2">' +
            '<div>' + money('f-fuel-amount', 'Valor pago', '50,00') + '</div>' +
            '<div>' + money('f-fuel-price', 'Preço do litro', '5,00') + '</div>' +
          '</div>' +
          '<label for="f-fuel-type">Tipo</label>' +
          '<select id="f-fuel-type"><option value="etanol">Etanol</option><option value="gasolina">Gasolina</option></select>' +
          '<p class="calc" id="liters-out"></p>' +
        '</div>' +
        '<div class="cat" data-cat="alimentacao"><h3>Alimentação na rua</h3>' + money('f-alim', 'Valor gasto', '0,00') + '</div>' +
        '<div class="cat" data-cat="lavagem"><h3>Lavagem</h3>' + money('f-lav', 'Valor gasto', '0,00') + '</div>' +
      '</section>' +
      '<section class="group gain grp">' +
        '<h2 class="grp-title">Ganhos</h2>' +
        '<div class="cat" data-cat="uber">' + money('f-uber', 'Ganho na Uber', '0,00') + '</div>' +
        '<div class="cat" data-cat="99">' + money('f-99', 'Ganho na 99', '0,00') + '</div>' +
        '<div class="cat" data-cat="particular">' + money('f-part', 'Ganho em corridas particulares', '0,00') + '</div>' +
      '</section>' +
      '<button class="primary" id="save-day">Salvar lançamento</button>' +
      '<p class="msg" id="msg" role="status"></p>' +
      '<section id="day-list"></section>';

    ['#f-fuel-amount', '#f-fuel-price'].forEach(function (s) { $(s).addEventListener('input', updLiters); });
    $('#f-fuel-type').addEventListener('change', updLiters);
    $('#f-date').addEventListener('change', function () { formDate = $('#f-date').value || todayISO(); renderDayList(); });
    $('#save-day').addEventListener('click', saveDay);
    document.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () { mode = b.dataset.mode; applyMode(); });
    });
    document.querySelectorAll('[data-cat-pick]').forEach(function (b) {
      b.addEventListener('click', function () { oneCat = b.dataset.catPick; applyMode(); });
    });
    applyMode();
    updLiters();
    renderDayList();
  }

  function applyMode() {
    var um = mode === 'um';
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
    $('#chips').hidden = !um;
    document.querySelectorAll('[data-cat-pick]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.catPick === oneCat)); });
    document.querySelectorAll('.cat').forEach(function (c) { c.hidden = um && c.dataset.cat !== oneCat; });
    document.querySelectorAll('.grp').forEach(function (g) {
      g.hidden = um && !g.querySelector('.cat[data-cat="' + oneCat + '"]');
      g.querySelector('.grp-title').hidden = um;
    });
    $('#save-day').textContent = um ? 'Salvar lançamento' : 'Salvar tudo';
  }

  function updLiters() {
    var a = num($('#f-fuel-amount').value), p = num($('#f-fuel-price').value);
    var type = $('#f-fuel-type').value;
    $('#liters-out').innerHTML = (a > 0 && p > 0)
      ? 'Entraram <span class="num">' + lit(a / p) + '</span> de ' + type
      : 'Preencha o valor pago e o preço do litro para ver quantos litros entraram.';
  }

  function saveDay() {
    var msg = $('#msg'), date = $('#f-date').value;
    if (!date) { say(msg, 'Escolha o dia do lançamento.', true); return; }
    var add = [];
    var aTxt = $('#f-fuel-amount').value.trim(), pTxt = $('#f-fuel-price').value.trim();
    var fuelOn = !$('.cat[data-cat="combustivel"]').hidden;
    if (fuelOn && (aTxt || pTxt)) {
      var fa = num(aTxt), fp = num(pTxt);
      if (!(fa > 0 && fp > 0)) { say(msg, 'No combustível, informe o valor pago e o preço do litro.', true); return; }
      add.push({ kind: 'gasto', cat: 'combustivel', amount: fa, price: fp, liters: fa / fp, fuel: $('#f-fuel-type').value });
    }
    for (var i = 0; i < SIMPLE.length; i++) {
      var f = SIMPLE[i], txt = $('#' + f[0]).value.trim();
      if (!txt || $('#' + f[0]).closest('.cat').hidden) continue;
      var n = num(txt);
      if (!(n > 0)) { say(msg, 'Valor inválido em ' + CAT_NAME[f[2]] + '.', true); return; }
      add.push({ kind: f[1], cat: f[2], amount: n });
    }
    if (!add.length) { say(msg, 'Preencha pelo menos um campo.', true); return; }
    add.forEach(function (e) { e.id = uid(); e.date = date; state.entries.push(e); });
    save();
    ['#f-fuel-amount', '#f-fuel-price', '#f-alim', '#f-lav', '#f-uber', '#f-99', '#f-part'].forEach(function (s) { $(s).value = ''; });
    formDate = date;
    updLiters();
    renderDayList();
    var t = totals(state.entries.filter(function (e) { return e.date === date; }));
    say(msg, 'Salvo. Lucro de ' + dm(date) + ': ' + brl(t.lucro), false);
  }

  function entryLabel(e) {
    if (e.cat === 'combustivel') {
      return 'Combustível' + (e.fuel ? ' (' + e.fuel + ')' : '') + '<span class="sub">' + lit(e.liters || 0) + ' a ' + brl(e.price || 0) + ' o litro</span>';
    }
    return CAT_NAME[e.cat] || e.cat;
  }

  function renderDayList() {
    var box = $('#day-list');
    if (!box) return;
    var list = state.entries.filter(function (e) { return e.date === formDate; });
    if (!list.length) {
      box.innerHTML = '<p class="empty">Nada lançado em ' + dmy(formDate) + ' ainda.</p>';
      return;
    }
    var t = totals(list);
    box.innerHTML =
      '<div class="card"><div class="group-head"><h2>Lançado em ' + dmy(formDate) + '</h2><span class="num ' + sign(t.lucro) + '">' + brl(t.lucro) + '</span></div>' +
      '<p class="muted">Ganhos ' + brl(t.g) + ' e gastos ' + brl(t.s) + '</p>' +
      '<ul class="rows">' + list.map(function (e) {
        return '<li><span>' + entryLabel(e) + '</span><span><span class="num ' + (e.kind === 'ganho' ? 'gain-text' : 'loss-text') + '">' +
          (e.kind === 'ganho' ? '+' : '−') + brl(e.amount) + '</span> <button class="link" data-del-entry="' + e.id + '">Apagar</button></span></li>';
      }).join('') + '</ul></div>';
  }

  /* ---------- aba Km ---------- */
  function viewKm() {
    $('#view').innerHTML =
      '<div class="card">' +
        '<h2>Quilometragem do carro</h2>' +
        '<p class="muted">Atualize uma vez por semana, não precisa ser todo dia.</p>' +
        '<label for="k-km">Quilometragem atual</label>' +
        '<input id="k-km" inputmode="numeric" autocomplete="off" placeholder="ex.: 84520">' +
        '<label for="k-date">Data da leitura</label>' +
        '<input type="date" id="k-date" value="' + todayISO() + '">' +
        '<button class="primary" id="save-km">Salvar quilometragem</button>' +
        '<p class="msg" id="kmsg" role="status"></p>' +
      '</div>' +
      '<section id="km-result"></section>' +
      '<section id="km-hist"></section>';
    $('#save-km').addEventListener('click', saveKm);
    renderKm();
  }

  function saveKm() {
    var msg = $('#kmsg'), n = num($('#k-km').value), date = $('#k-date').value;
    if (!(n > 0) || !date) { say(msg, 'Informe a quilometragem e a data.', true); return; }
    n = Math.round(n);
    var test = state.readings.concat([{ id: 'x', date: date, km: n }]).sort(function (a, b) {
      if (a.date === b.date) return a.km - b.km;
      return a.date < b.date ? -1 : 1;
    });
    for (var i = 1; i < test.length; i++) {
      if (test[i].km < test[i - 1].km) {
        say(msg, 'Essa quilometragem não combina com as outras leituras. Ela só pode crescer com o tempo.', true);
        return;
      }
    }
    state.readings.push({ id: uid(), date: date, km: n });
    save();
    $('#k-km').value = '';
    say(msg, 'Quilometragem salva.', false);
    renderKm();
  }

  function renderKm() {
    var iv = intervals(), last = iv[iv.length - 1], res = $('#km-result');
    if (!state.readings.length) {
      res.innerHTML = '<p class="empty">Salve a primeira leitura agora. A partir da segunda, eu mostro o lucro por litro.</p>';
    } else if (!last) {
      res.innerHTML = '<p class="empty">Primeira leitura salva. Na próxima atualização, eu calculo os litros gastos e o lucro por litro.</p>';
    } else {
      res.innerHTML =
        '<div class="hero ' + (last.lucro < 0 ? 'neg' : 'pos') + '">' +
          '<div class="num big">' + (last.perL == null ? '–' : brl(last.perL)) + '</div>' +
          '<p>Lucro por litro, de ' + dm(last.from) + ' a ' + dm(last.to) + '</p>' +
          (last.perL == null ? '<p>Nenhum abastecimento lançado nesse período.</p>' : '') +
        '</div>' +
        '<div class="card"><dl class="facts">' +
          '<div><dt>Km rodados</dt><dd>' + kmf(last.km) + '</dd></div>' +
          '<div><dt>Litros abastecidos</dt><dd>' + (last.lit > 0 ? lit(last.lit) : '–') + '</dd></div>' +
          '<div><dt>Consumo</dt><dd>' + (last.kmL == null ? '–' : dec1(last.kmL) + ' km/L') + '</dd></div>' +
          '<div><dt>Lucro por km</dt><dd>' + (last.perKm == null ? '–' : brl(last.perKm)) + '</dd></div>' +
          '<div><dt>Ganhos</dt><dd class="gain-text">' + brl(last.ganhos) + '</dd></div>' +
          '<div><dt>Gastos</dt><dd class="loss-text">' + brl(last.gastos) + '</dd></div>' +
          '<div><dt>Lucro real do período</dt><dd class="' + sign(last.lucro) + '">' + brl(last.lucro) + '</dd></div>' +
        '</dl>' +
        '<p class="muted">Os litros são os que você abasteceu entre as duas leituras. Fica mais exato se o tanque estiver no mesmo nível nas duas, por exemplo logo depois de abastecer.</p></div>';
    }

    var r = sortedReadings().reverse(), hist = $('#km-hist');
    if (!r.length) { hist.innerHTML = ''; return; }
    var byId = {};
    iv.forEach(function (x) { byId[x.id] = x; });
    hist.innerHTML = '<div class="card"><h2>Leituras</h2><ul class="rows">' + r.map(function (x) {
      var i = byId[x.id];
      var sub = i ? 'rodou ' + kmf(i.km) + (i.perL != null ? ', ' + brl(i.perL) + ' por litro' : '') : 'primeira leitura';
      return '<li><span>' + dmy(x.date) + '<span class="sub">' + sub + '</span></span><span><span class="num">' + kmf(x.km) +
        '</span> <button class="link" data-del-reading="' + x.id + '">Apagar</button></span></li>';
    }).join('') + '</ul></div>';
  }

  /* ---------- aba Mês ---------- */
  function monthLabel(m) {
    var y = +m.slice(0, 4), mo = +m.slice(5, 7);
    return new Date(y, mo - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  }
  function shiftMonth(m, d) {
    var y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + d;
    var dt = new Date(y, mo, 1);
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
  }

  function viewMes() {
    var list = state.entries.filter(function (e) { return e.date.indexOf(month) === 0; });
    var t = totals(list);
    var perL = t.lit > 0 ? t.lucro / t.lit : null;

    var r = sortedReadings(), startR = null, endR = null, mStart = month + '-01', mEnd = month + '-31';
    r.forEach(function (x) { if (x.date < mStart) startR = x; });
    if (!startR) { for (var i = 0; i < r.length; i++) { if (r[i].date >= mStart && r[i].date <= mEnd) { startR = r[i]; break; } } }
    r.forEach(function (x) { if (x.date <= mEnd) endR = x; });
    var km = (startR && endR && endR.km > startR.km) ? endR.km - startR.km : null;

    var days = {};
    list.forEach(function (e) {
      var d = days[e.date] || (days[e.date] = { g: 0, s: 0 });
      if (e.kind === 'ganho') d.g += e.amount; else d.s += e.amount;
    });
    var dayKeys = Object.keys(days).sort().reverse();

    function rowsFor(cats, kind) {
      return '<ul class="rows">' + cats.map(function (c) {
        return '<li><span>' + CAT_NAME[c] + '</span><span class="num">' + brl(t.by[c] || 0) + '</span></li>';
      }).join('') + '</ul>';
    }

    $('#view').innerHTML =
      '<div class="monthnav"><button class="ghost" id="m-prev" aria-label="Mês anterior">‹</button><strong>' + monthLabel(month) +
        '</strong><button class="ghost" id="m-next" aria-label="Próximo mês">›</button></div>' +
      '<section class="hero ' + (t.lucro < 0 ? 'neg' : 'pos') + '">' +
        '<div class="num big">' + brl(t.lucro) + '</div>' +
        '<p>Lucro real do mês, já descontados todos os gastos</p>' +
        '<div class="num mid">' + (perL == null ? '–' : brl(perL)) + '</div>' +
        '<p>Lucro por litro abastecido no mês</p>' +
      '</section>' +
      '<section class="group gain"><div class="group-head"><h2>Ganhos</h2><span class="num gain-text">' + brl(t.g) + '</span></div>' + rowsFor(GANHOS) + '</section>' +
      '<section class="group"><div class="group-head"><h2>Gastos</h2><span class="num loss-text">' + brl(t.s) + '</span></div>' + rowsFor(GASTOS) + '</section>' +
      '<section class="card"><h2>Combustível e quilometragem</h2><dl class="facts">' +
        '<div><dt>Litros abastecidos</dt><dd>' + (t.lit > 0 ? lit(t.lit) : '–') + '</dd></div>' +
        '<div><dt>Preço médio do litro</dt><dd>' + (t.lit > 0 ? brl((t.by.combustivel || 0) / t.lit) : '–') + '</dd></div>' +
        '<div><dt>Km rodados</dt><dd>' + (km ? kmf(km) : '–') + '</dd></div>' +
        '<div><dt>Consumo estimado</dt><dd>' + (km && t.lit > 0 ? dec1(km / t.lit) + ' km/L' : '–') + '</dd></div>' +
        '<div><dt>Lucro por km</dt><dd>' + (km ? brl(t.lucro / km) : '–') + '</dd></div>' +
      '</dl>' +
      (km ? '<p class="muted">Km pelas leituras de ' + dm(startR.date) + ' a ' + dm(endR.date) + '.</p>' : '<p class="muted">Salve leituras de quilometragem na aba Km para ver esses números.</p>') +
      '</section>' +
      '<section class="card"><h2>Dia a dia</h2>' +
      (dayKeys.length
        ? '<div class="scroll"><table><thead><tr><th>Dia</th><th>Ganhos</th><th>Gastos</th><th>Lucro</th></tr></thead><tbody>' +
          dayKeys.map(function (k) {
            var d = days[k], l = d.g - d.s;
            return '<tr><td>' + dm(k) + '</td><td class="num">' + brl(d.g) + '</td><td class="num">' + brl(d.s) + '</td><td class="num ' + sign(l) + '">' + brl(l) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="muted">Nenhum lançamento neste mês.</p>') +
      '</section>' +
      '<details><summary>Backup dos dados</summary>' +
        '<p class="muted">Toque em Copiar backup e guarde o texto em um lugar seguro, como as notas do celular. Para restaurar, cole o texto na caixa e toque em Restaurar.</p>' +
        '<textarea id="b-text" rows="5" aria-label="Texto do backup"></textarea>' +
        '<div class="btns"><button class="ghost" id="b-copy">Copiar backup</button><button class="ghost" id="b-restore">Restaurar</button></div>' +
        '<p class="msg" id="b-msg" role="status"></p>' +
      '</details>';

    $('#m-prev').addEventListener('click', function () { month = shiftMonth(month, -1); viewMes(); });
    $('#m-next').addEventListener('click', function () { month = shiftMonth(month, 1); viewMes(); });
    $('#b-copy').addEventListener('click', copyBackup);
    $('#b-restore').addEventListener('click', function (ev) { arm(ev.currentTarget, 'Toque de novo para substituir os dados', restoreBackup); });
  }

  function copyBackup() {
    var ta = $('#b-text'), msg = $('#b-msg');
    ta.value = JSON.stringify({ app: 'caixa-motorista', v: 1, entries: state.entries, readings: state.readings });
    ta.focus(); ta.select();
    var done = function () { say(msg, 'Backup copiado. Cole em um lugar seguro.', false); };
    var fallback = function () {
      try { if (document.execCommand('copy')) { done(); return; } } catch (e) {}
      say(msg, 'Selecionei o texto. Segure sobre ele e escolha Copiar.', false);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function restoreBackup() {
    var ta = $('#b-text'), msg = $('#b-msg');
    try {
      var d = JSON.parse(ta.value);
      if (!d || !Array.isArray(d.entries) || !Array.isArray(d.readings)) throw new Error('formato');
      state.entries = d.entries;
      state.readings = d.readings;
      save();
      viewMes();
      say($('#b-msg'), 'Dados restaurados.', false);
      $('details').open = true;
    } catch (e) {
      say(msg, 'Não consegui ler esse texto. Cole o backup completo na caixa.', true);
      var b = $('#b-restore');
      delete b.dataset.armed;
      b.textContent = 'Restaurar';
    }
  }

  /* ---------- navegação e eventos globais ---------- */
  function render() {
    document.querySelectorAll('.tabs button').forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (tab === 'lancar') viewLancar();
    else if (tab === 'km') viewKm();
    else viewMes();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
    if (t.dataset.delEntry) {
      var id = t.dataset.delEntry;
      arm(t, 'Confirmar', function () {
        state.entries = state.entries.filter(function (e) { return e.id !== id; });
        save(); renderDayList();
      });
      return;
    }
    if (t.dataset.delReading) {
      var rid = t.dataset.delReading;
      arm(t, 'Confirmar', function () {
        state.readings = state.readings.filter(function (e) { return e.id !== rid; });
        save(); renderKm();
      });
    }
  });

  load();
  if (!storageOk) $('#banner').hidden = false;
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
